[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "steven4cor-annotate_jd251"
version = "0.1.0"
description = "为每一项打分并与阈值比较，明确标出通过、边界与不通过三档"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "steven4cor" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://steven4cor.github.io"
Repository = "https://github.com/steven4cor/annotate_jd251"
Issues = "https://github.com/steven4cor/annotate_jd251/issues"

[project.scripts]
annotate_jd251 = "annotate_jd251:main"

[tool.setuptools]
py-modules = ["annotate_jd251"]
